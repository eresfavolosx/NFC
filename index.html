<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Program and manage NFC bracelets with custom links. Admin console for dynamic link management." />
  <meta name="theme-color" content="#FF8C00" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tocaito" />
  
  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-startup-image" href="/icons/icon-512.png" />

  <title>Tocaito</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
</head>

<body>
  <div id="app" aria-busy="true">
    <progress aria-label="Loading Tocaito NFC workspace" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0;"></progress>
    <div aria-hidden="true" class="nfc-shell-skeleton" style="min-height:100vh;padding:24px;display:grid;gap:20px;background:#0f0f1a;">
      <div class="skeleton-block" style="height:56px;max-width:340px;border-radius:12px;background:rgba(255,255,255,0.08);"></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;">
        <div class="skeleton-block" style="height:120px;border-radius:16px;background:rgba(255,255,255,0.08);"></div>
        <div class="skeleton-block" style="height:120px;border-radius:16px;background:rgba(255,255,255,0.08);"></div>
        <div class="skeleton-block" style="height:120px;border-radius:16px;background:rgba(255,255,255,0.08);"></div>
      </div>
      <div class="skeleton-block" style="height:280px;border-radius:16px;background:rgba(255,255,255,0.08);"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
