<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0F0F1A;
            color: #E8E8F0;
        }

        .container {
            text-align: center;
            padding: 2rem;
            width: min(420px, 92vw);
        }

        .sr-only:where(:not(:focus-within, :active)) {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            padding: 0 !important;
            margin: -1px !important;
            overflow: hidden !important;
            clip-path: inset(50%) !important;
            white-space: nowrap !important;
            border: 0 !important;
        }

        .redirect-card {
            padding: 2rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
        }

        .skeleton-line {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            width: 100%;
            height: 14px;
        }

        .skeleton-line::after {
            content: '';
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent 0%, rgba(167, 139, 250, 0.3) 50%, transparent 100%);
        }

        @media (prefers-reduced-motion: no-preference) {
            .skeleton-line::after {
                animation: redirectShimmer 1.45s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }
        }

        @keyframes redirectShimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        p {
            color: #A0A0C0;
            font-size: 0.9rem;
        }

        a {
            color: #A78BFA;
        }
    </style>
</head>

<body>
    <div class="container" aria-busy="true">
        <progress aria-label="Redirecting to NFC tag destination" class="sr-only"></progress>
        <div class="redirect-card" aria-hidden="true">
            <div class="skeleton-line" style="width: 56px; height: 56px; border-radius: 50%;"></div>
            <div class="skeleton-line" style="width: 65%; height: 18px;"></div>
            <div class="skeleton-line" style="width: 85%;"></div>
            <p>Redirecting…</p>
        </div>
    </div>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const url = params.get('url');
            const id = params.get('id');

            if (url) {
                // Track tap if tracking is available
                if (id) {
                    try {
                        const STORAGE_KEY = 'nfc_tag_manager';
                        const raw = localStorage.getItem(STORAGE_KEY);
                        if (raw) {
                            const data = JSON.parse(raw);
                            const link = data.links?.find(l => l.id === id);
                            if (link) {
                                link.clicks = (link.clicks || 0) + 1;
                                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                            }
                        }
                    } catch (e) {
                        // Silent fail — redirect is more important
                    }
                }
                window.location.replace(url);
            } else {
                document.querySelector('.container').innerHTML = `
          <p>No redirect URL specified.</p>
          <p style="margin-top: 1rem;">
            <a href="/">Go to NFC Tag Manager</a>
          </p>
        `;
            }
        })();
    </script>
</body>

</html>
